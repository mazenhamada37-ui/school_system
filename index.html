<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <link rel="stylesheet" href="login/style-login/main.css" />   
    <title>login</title>
  </head>

  <body>
    <div class="sec-1">
      <img src="images-login/Margin.png" alt="" />
      <h1>Scholar Slate</h1>
      <p>Welcome back to your Digital Atelier</p>
    </div>

    <div class="tabs">
      <button class="tab active">Student</button>
      <button class="tab">Teacher</button>
      <button class="tab">Admin</button>
    </div>

    <div class="sec-3">
      <div class="input-group">
        <label>EMAIL ADDRESS</label>
        <div class="field">
          <span class="icon"><img src="images-login/email icon.png" alt="" /></span>
          <input type="email" placeholder="Enter Your Email" />
        </div>
      </div>

      <div class="input-group">
        <div class="label-row">
          <label>PASSWORD</label>
        </div>
        <div class="field">
          <span class="icon"><img src="images-login/bill.png" alt="" /></span>
          <input type="password" placeholder="Enter Your Password" />
        </div>
        <a href="../forget-password/index-forget-password.html" class="forgot"
          >Forgot password?</a
        >
      </div>

      <button class="login-btn">Sign In to Dashboard <span>→</span></button>
    </div>
    <br />
    <p>
      New to Scholar Slate?
      <a href="../register/index-register.html">Create an account</a>
    </p>

    <script src="mooo.js"></script>
  </body>
</html>
